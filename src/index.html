<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My English Buddy</title>
  <base href="./">
  <!--
    viewport-fit=cover lets the page use the whole screen on phones with a notch (the CSS keeps buttons
    clear of it with env(safe-area-inset-*)). interactive-widget=resizes-content shrinks the page when the
    keyboard opens (Chrome 108+), so the typing box stays visible.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#6a3fc9">
  <meta name="description" content="Practise English every day: vocabulary, sentences, speaking and role-play with Tamil support. Works offline.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
</head>
<body>
  <app-root>Loading My English Buddy…</app-root>
  <noscript>My English Buddy needs JavaScript to run.</noscript>
</body>
</html>
